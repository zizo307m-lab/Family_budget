<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Budget Familial</title>
  <meta name="description" content="Suivi du budget familial et des dépenses — simple, rapide, hors ligne." />
  <meta name="theme-color" content="#0f766e" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // Applique le thème avant le premier affichage (évite le flash clair/sombre).
    try {
      var t = JSON.parse(localStorage.getItem('budget-familial:v1') || '{}').settings;
      if (t && (t.theme === 'light' || t.theme === 'dark')) document.documentElement.dataset.theme = t.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"><main id="view" aria-live="polite"></main></div>

  <button class="fab" id="fab" aria-label="Ajouter une dépense" title="Ajouter une dépense">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
  </button>
  <nav class="nav" id="nav" aria-label="Navigation principale"><div class="nav-inner" id="nav-inner"></div></nav>

  <div id="sheet-root"></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <div id="lock-root"></div>

  <noscript><p style="padding:24px;font-family:sans-serif">Cette application nécessite JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
